notation = [
  { sym = "sext", desc = "sign extension to 32 bits" },
  { sym = "M[a]", desc = "32-bit little-endian word in memory at byte address a" },
  { sym = "x[i:j]", desc = "bits i down to j of x" },
  { sym = "(c)", desc = "1 if condition c holds, 0 otherwise" },
  { sym = "<u, ≥u", desc = "unsigned comparison (signed otherwise)" },
  { sym = ">> / >>>", desc = "logical / arithmetic right shift" },
  { sym = "+ − × / √", desc = "on f registers: float_spec-compatible single precision, always rounded to nearest, ties to even" },
  { sym = "int / float", desc = "conversion to int32 / single precision, always rounded to nearest, ties to even" },
]

[fields]
opcode = 7
funct3 = 3
funct7 = 7
rd = 5
rs1 = 5
rs2 = 5

[formats]
R = "funct7 rs2 rs1 funct3 rd opcode"
I = "imm[11:0] rs1 funct3 rd opcode"
S = "imm[11:5] rs2 rs1 funct3 imm[4:0] opcode"
B = "imm[12|10:5] rs2 rs1 funct3 imm[4:1|11] opcode"
U = "imm[19:0] rd opcode"
J = "imm[20|10:1|11|19:12] rd opcode"

[registers]
x = [
  { abi = "zero", role = "always zero" },
  { abi = "ra", role = "return address", saver = "caller" },
  { abi = "sp", role = "stack pointer", saver = "callee" },
  { abi = "gp", role = "global pointer" },
  { abi = "tp", role = "thread pointer" },
  { abi = "t0", role = "temporary", saver = "caller" },
